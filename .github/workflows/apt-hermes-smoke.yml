name: Live signed APT Hermes smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-termux-hermes-apt-smoke
  cancel-in-progress: true

jobs:
  native-termux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      TERMUX_IMAGE: termux/termux-docker@sha256:3aed9c7fbcf9195a9919deaad418da006232864a779fb4f322d68a34887a2e15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Hermes entirely through pkg
        run: |
          set -Eeuo pipefail
          docker pull "$TERMUX_IMAGE"
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            "$TERMUX_IMAGE" \
            /entrypoint.sh bash -lc '
              set -Eeuo pipefail
              bash <(curl -fsSL https://raw.githubusercontent.com/adybag14-cyber/termux-python/main/scripts/setup_apt_repo.sh)
              pkg install -y hermes-agent
              dpkg-query -W -f="${Status}\n" hermes-agent | grep -Fx "install ok installed"
              hermes --version
              hermes version | tee /tmp/version.txt
              grep -F "Install method: apt" /tmp/version.txt
              if hermes update >/tmp/update.txt 2>&1; then exit 1; fi
              grep -F "pkg upgrade hermes-agent" /tmp/update.txt
              "$PREFIX/lib/hermes-agent/app/venv/bin/python" - <<"PY"
          import importlib
          for module in ("hermes_cli", "psutil", "yaml", "cffi", "PIL", "pydantic_core", "cryptography", "jiter", "rpds"):
              importlib.import_module(module)
          print("Live APT Hermes import smoke passed")
          PY
            '