name: Live signed APT Hermes smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-termux-hermes-apt-smoke
  cancel-in-progress: true

jobs:
  native-termux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install through signed pkg and exercise public streamed recovery
        run: |
          set -Eeuo pipefail
          TERMUX_IMAGE="$(jq -er '.termux_image' manifest/release.json)"
          PACKAGE_VERSION="$(jq -er '.package_version' manifest/release.json)"
          [[ "$TERMUX_IMAGE" =~ ^termux/termux-docker@sha256:[a-f0-9]{64}$ ]]
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1;; esac
          docker pull --platform linux/arm64 "$TERMUX_IMAGE"
          docker run --rm --platform linux/arm64 --privileged \
            --security-opt seccomp=unconfined \
            -v "$PWD/scripts/check_live_apt.sh:/check-live-apt.sh:ro" \
            "$TERMUX_IMAGE" bash /check-live-apt.sh "$PACKAGE_VERSION" "$GITHUB_SHA"
