name: Live signed APT Hermes smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-termux-hermes-apt-smoke
  cancel-in-progress: true

jobs:
  native-termux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      TERMUX_IMAGE: termux/termux-docker@sha256:3aed9c7fbcf9195a9919deaad418da006232864a779fb4f322d68a34887a2e15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Hermes entirely through pkg
        run: |
          set -Eeuo pipefail
          docker pull "$TERMUX_IMAGE"
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            "$TERMUX_IMAGE" \
            /entrypoint.sh bash -lc '
              set -Eeuo pipefail
              TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              mkdir -p "$TMPDIR"
              printf "%s\n" "deb https://packages.termux.dev/apt/termux-main stable main" > "$PREFIX/etc/apt/sources.list"
              pkg update -y
              bash <(curl -fsSL https://raw.githubusercontent.com/adybag14-cyber/termux-python/main/scripts/setup_apt_repo.sh)
              pkg install -y hermes-agent
              dpkg-query -W -f="\${Status}\n" hermes-agent | grep -Fx "install ok installed"
              dpkg --compare-versions "$(dpkg-query -W -f="\${Version}" hermes-agent)" ge "0.20.6+termux1"
              ! dpkg-query -W python >/dev/null 2>&1
              hermes --version
              grep -Fx apt "$PREFIX/lib/hermes-agent/app/.install_method"
              if hermes update >"$TMPDIR/update.txt" 2>&1; then exit 1; fi
              grep -F "pkg upgrade hermes-agent" "$TMPDIR/update.txt"
              "$PREFIX/lib/hermes-agent/app/venv/bin/python" - <<"PY"
          import importlib
          for module in ("hermes_cli", "psutil", "yaml", "cffi", "PIL", "pydantic_core", "cryptography", "jiter", "rpds", "mcp", "httpx2", "snowballstemmer", "telegram"):
              importlib.import_module(module)
          print("Live APT Hermes import smoke passed")
          PY

              # Exercise the public recovery command against preserved user
              # state and a simulated interrupted legacy Git checkout.
              printf "RECOVERY_SENTINEL=preserve-me\n" > "$HOME/.hermes/.env"
              env_before="$(sha256sum "$HOME/.hermes/.env" | awk "{print \$1}")"
              mkdir -p "$HOME/.hermes/hermes-agent/.git"
              : > "$HOME/.hermes/hermes-agent/.git/index.lock"
              hermes config set model.max_tokens 65536
              pkg uninstall -y hermes-agent
              ! dpkg-query -W hermes-agent >/dev/null 2>&1
              recovery_cache="${XDG_CACHE_HOME:-$HOME/.cache}/hermes-recovery"
              recovery_partial="$recovery_cache/hermes-agent_0.20.6+termux1_aarch64.deb.part"
              apt_partial="$PREFIX/var/cache/apt/archives/partial/hermes-agent_0.20.6+termux1_aarch64.deb"
              mkdir -p "$(dirname "$apt_partial")"
              curl -fsSL --range 0-1048575 \
                http://144.21.61.111/termux/pool/main/hermes-agent_0.20.6+termux1_aarch64.deb \
                -o "$apt_partial"
              test "$(wc -c < "$apt_partial")" = 1048576
              curl -fsSL --retry 6 --retry-all-errors \
                https://raw.githubusercontent.com/adybag14-cyber/termux-hermes/main/install.sh | bash
              test "$(sha256sum "$HOME/.hermes/.env" | awk "{print \$1}")" = "$env_before"
              test -e "$HOME/.hermes/hermes-agent/.git/index.lock"
              test "$(hermes config get model.max_tokens --json)" = "8192"
              dpkg --compare-versions "$(dpkg-query -W -f="\${Version}" hermes-agent)" ge "0.20.6+termux1"
              test ! -e "$recovery_partial"
              test ! -e "${recovery_partial%.part}"
              test ! -e "$apt_partial"
              hermes gateway stop >/dev/null 2>&1 || true
            '
